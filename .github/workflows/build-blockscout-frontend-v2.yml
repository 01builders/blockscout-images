name: Build Blockscout Frontend v2.10.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-blockscout-frontend-v2.yml
      - scripts/patch-frontend-node.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blockscout-frontend-v2-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/01builders/blockscout-frontend
  IMAGE_TAG: 2.10.3-02
  UPSTREAM_REF: v2.10.3
  UPSTREAM_SHA: 10d8428db2f3b5a832640ea2e68ddcc33eff3a49

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out image definitions
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out Blockscout frontend source
        uses: actions/checkout@v7
        with:
          repository: blockscout/frontend
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Verify upstream source revision
        run: test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Apply reviewed Node security patch
        run: python3 scripts/patch-frontend-node.py upstream/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/01builders/blockscout-images
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.UPSTREAM_SHA }}
            GIT_TAG=${{ env.UPSTREAM_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
