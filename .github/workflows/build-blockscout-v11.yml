name: Build Blockscout v11.2.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-blockscout-v11.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blockscout-v11-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/01builders/blockscout
  IMAGE_TAG: 11.2.3-01
  UPSTREAM_REF: v11.2.3
  UPSTREAM_SHA: 2cbdede30e4b49bfee8cbfa8897d6dab494d84ab

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out image definitions
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out Blockscout source
        uses: actions/checkout@v5
        with:
          repository: blockscout/blockscout
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Verify upstream source revision
        run: test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          file: ./upstream/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/01builders/blockscout-images
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          build-args: |
            BLOCKSCOUT_VERSION=v11.2.3.+commit.2cbdede
            RELEASE_VERSION=11.2.3
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
